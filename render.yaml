services:
  - type: web
    name: butterfly-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run prisma:generate && npm run build -w @butterfly/shared && npm run build -w @butterfly/api && npm run prisma:deploy:render && npm run prisma:seed
    startCommand: npm run start -w @butterfly/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: butterfly-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 10000

databases:
  - name: butterfly-db
    plan: free
    databaseName: butterfly
    user: butterfly
